<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أكاديمية خالد للتمريض</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f2f6ff;color:#111}
header{background:#0b4da2;color:#fff;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:26px}header p{opacity:.9}
.wrap{max-width:900px;margin:auto;padding:16px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.card{background:#fff;border-radius:14px;padding:16px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card b{display:block;font-size:17px}.card span{color:#666;font-size:13px}
.card i{font-size:28px;display:block;margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
.box{background:#fff;border-radius:16px;padding:20px;max-width:500px;width:100%}
.btn{display:block;text-align:center;background:#0b4da2;color:#fff;padding:13px;border-radius:10px;text-decoration:none;margin-top:12px}
.close{background:#eee;border:0;padding:10px;border-radius:10px;width:100%;margin-top:10px}
</style>
</head>
<body>
<header><h1>🩺 أكاديمية خالد للتمريض</h1><p>اتعلم التمريض من الصفر للاحتراف</p></header>
<div class="wrap">
<input id="q" placeholder="ابحث عن أي درس... مثلا: ضغط، سكر، إسعافات">
<div class="grid" id="grid"></div>
</div>
<div class="modal" id="m"><div class="box"><h2 id="mt"></h2><p id="md"></p><a class="btn" id="open" target="_blank" href="#">فتح الدرس كامل 📚</a><button class="close" onclick="document.getElementById('m').style.display='none'">إغلاق</button></div></div>
<script>
var T=[
["🩸","قياس الضغط","Blood Pressure"],
["🍬","مرض السكر","Diabetes"],
["🫀","القلب","Heart"],
["🫁","الجهاز التنفسي","Respiratory"],
["🧠","الجهاز العصبي","Nervous System"],
["🩹","الإسعافات الأولية","First Aid"],
["🧪","التحاليل الطبية","Lab Tests"],
["🦠","مكافحة العدوى","Infection Control"],
["💉","الحقن والكانولا","Injection"],
["🤰","تمريض النساء","Maternity"],
["👶","تمريض الأطفال","Pediatrics"],
["💊","الأدوية","Pharmacology"]
];
function render(){
var q=document.getElementById('q').value.toLowerCase();
var g=document.getElementById('grid');g.innerHTML='';
for(var i=0;i<T.length;i++){
var name=T[i][1]+' - المستوى '+(Math.floor(i/6)+1);
if(q && name.toLowerCase().indexOf(q)==-1 && T[i][2].toLowerCase().indexOf(q)==-1) continue;
var d=document.createElement('div');d.className='card';
d.innerHTML='<i>'+T[i][0]+'</i><b>'+T[i][1]+'</b><span>'+T[i][2]+'</span>';
(function(t){d.onclick=function(){
document.getElementById('mt').textContent=t[1];
document.getElementById('md').textContent='درس كامل في أكاديمية خالد للتمريض: '+t[1]+' - '+t[2];
document.getElementById('open').href='https://www.google.com/search?q='+encodeURIComponent(t[1]+' تمريض شرح كامل');
document.getElementById('m').style.display='flex';
}})(T[i]);
g.appendChild(d);
}}
document.getElementById('q').oninput=render;render();
</script>
</body>
</html>
