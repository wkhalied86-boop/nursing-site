<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>.p{background:#2a3a6e;color:#fff;border:0;padding:15px;border-radius:99px}.p.on{background:#fff;color:#000}.c{background:blue;color:#fff;padding:20px;margin:5px;border-radius:10px}</style></head><body><h2>TEST 3</h2><button class="p" onclick="sh(0,this)">الكل</button><button class="p" onclick="sh(1,this)">قسم 1</button><button class="p" onclick="sh(5,this)">قسم 5</button><div id="g"><a class="c" data-s="1">درس قسم 1</a><a class="c" data-s="5">درس قسم 5</a></div><script>let v=1;function ap(){document.querySelectorAll(".c").forEach(c=>c.style.display=(v==0||c.dataset.s==v)?"block":"none")}function sh(n,el){alert("دوس شغال رقم "+n);v=n;document.querySelectorAll(".p").forEach(p=>p.classList.remove("on"));el.classList.add("on");ap()}</script></body></html>
